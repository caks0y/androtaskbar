name: Import Windroid source
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-windroid.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Copy the latest public Windroid source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/caks0y/windroid.git /tmp/windroid
          rm -rf /tmp/windroid/.git
          rsync -a --exclude='.git/' --exclude='README.md' /tmp/windroid/ ./
          rm -f .github/workflows/import-windroid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Import complete Windroid source'
          git push origin HEAD:main
