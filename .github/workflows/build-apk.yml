name: Build APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fix Kotlin compilation errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          start_menu = Path('app/src/main/java/com/example/ui/components/StartMenuOverlay.kt')
          text = start_menu.read_text()
          if 'import androidx.compose.foundation.layout.fillMaxSize' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.layout.fillMaxWidth\n',
                  'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\n',
                  1,
              )
              start_menu.write_text(text)

          taskbar = Path('app/src/main/java/com/example/ui/components/TaskbarBar.kt')
          text = taskbar.read_text()
          if 'import androidx.compose.material.icons.outlined.Apps' not in text:
              text = text.replace(
                  'import androidx.compose.material.icons.Icons\n',
                  'import androidx.compose.material.icons.Icons\n'
                  'import androidx.compose.material.icons.outlined.Apps\n'
                  'import androidx.compose.material.icons.outlined.Language\n',
                  1,
              )
          text = text.replace(
              '@Composable\n@Composable\nprivate fun TaskbarWidgetsOverlayButton',
              '@Composable\nprivate fun TaskbarWidgetsOverlayButton',
              1,
          )
          taskbar.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/example/ui/components/StartMenuOverlay.kt app/src/main/java/com/example/ui/components/TaskbarBar.kt
            git commit -m 'Fix Kotlin compilation errors' -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
            git push
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'Android sdkmanager was not found on the runner.' >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          PACKAGES="$("$SDKMANAGER" --list)"
          case "$PACKAGES" in
            *'platforms;android-36.1'*) SDK_PLATFORM='platforms;android-36.1' ;;
            *) SDK_PLATFORM='platforms;android-36' ;;
          esac
          "$SDKMANAGER" "$SDK_PLATFORM" 'platform-tools' 'build-tools;36.0.0'
      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androtaskbar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
